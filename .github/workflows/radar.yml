name: Radar de mercados

on:
  schedule:
    - cron: "7,37 * * * *"     # cada 30 minutos (hora UTC)
  workflow_dispatch:
    inputs:
      resumen:
        description: "Enviar el resumen por Telegram ahora"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recuperar estado anterior (rama 'datos')
        run: |
          mkdir -p _site
          if git ls-remote --exit-code --heads origin datos >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch datos \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" _prev
            cp -r _prev/. _site/ && rm -rf _site/.git _prev
          fi

      - name: Ejecutar radar
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          EXTRA=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.resumen }}" = "true" ]; then EXTRA="--resumen"; fi
          python main.py --site _site $EXTRA

      - name: Guardar estado (rama 'datos')
        if: always()
        run: |
          [ -f _site/state.json ] || exit 0
          cd _site
          git init --quiet -b datos
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Estado $(date -u +%FT%RZ)"
          git push --quiet --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" datos
          rm -rf .git

      - name: Preparar web pública (solo panel, sin estado)
        run: |
          mkdir -p _public
          cp _site/index.html _site/data.js _public/
          touch _public/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public

      - name: Publicar panel
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
